name: Run EA Experiments

on:
  workflow_dispatch:

jobs:
  generate-chunks:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.generate.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate chunks
        id: generate
        run: |
          python generate_chunks.py --output chunks.json
          # Проверка на всякий случай
          if [ ! -f chunks.json ]; then
            echo "Error: chunks.json was not created" >&2
            exit 1
          fi
          CHUNKS_COUNT=$(jq length chunks.json)
          if [ "$CHUNKS_COUNT" -eq 0 ]; then
            echo "Error: chunks.json is empty" >&2
            exit 1
          fi
          echo "Chunks count: $CHUNKS_COUNT" >> $GITHUB_STEP_SUMMARY
          # Перезаписываем в GITHUB_OUTPUT, даже если скрипт уже записал (не повредит)
          echo "chunks=$(jq -c . chunks.json)" >> $GITHUB_OUTPUT

  run-chunks:
    needs: generate-chunks
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.generate-chunks.outputs.chunks) }}
    name: Chunk ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify installation
        run: pip list
      - name: Run all items in this chunk sequentially
        env:
          CHUNK_JSON: ${{ toJson(matrix.chunk) }}
        run: |
          echo "$CHUNK_JSON" | jq -c '.[]' | while read item; do
          pop_size=$(echo "$item" | jq -r '.pop_size')
          gens=$(echo "$item" | jq -r '.gens')
          cross_rate=$(echo "$item" | jq -r '.cross_rate')
          mut_rate=$(echo "$item" | jq -r '.mut_rate')
          tourn_size=$(echo "$item" | jq -r '.tourn_size')
          elitism=$(echo "$item" | jq -r '.elitism')
          use_local_search=$(echo "$item" | jq -r '.use_local_search')
          ls_freq=$(echo "$item" | jq -r '.ls_freq')
          strategy=$(echo "$item" | jq -r '.strategy')
          init_method=$(echo "$item" | jq -r '.init_method')

          mkdir -p configs
          cat > configs/ea_params.json <<EOF
          {
            "pop_size": $pop_size,
            "gens": $gens,
            "cross_rate": $cross_rate,
            "mut_rate": $mut_rate,
            "tourn_size": $tourn_size,
            "elitism": $elitism,
            "use_local_search": $use_local_search,
            "ls_freq": $ls_freq,
            "strategy": "$strategy",
            "init_method": "$init_method"
          }
          EOF

          pytest test/integration/test_ea_tests.py -v || true

          if [ -f configs/ea_results.csv ]; then
          mv configs/ea_results.csv "results_pop${pop_size}_gen${gens}_cr${cross_rate}_mr${mut_rate}.csv"
          else
          echo "Warning: configs/ea_results.csv not found for $pop_size $gens"
          fi
          done
      - name: Upload all CSVs from this chunk
        uses: actions/upload-artifact@v4
        with:
          name: results-chunk-${{ strategy.job-index }}-${{ github.run_id }}
          path: "results_*.csv"

  merge-results:
    needs: run-chunks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: pip install pandas
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-chunk-*
          merge-multiple: true
          path: ./all_results
      - name: Merge CSVs using merge-csv.py
        run: |
          cp ../merge-csv.py .
          python merge-csv.py
        working-directory: ./all_results
      - name: Upload final CSV
        uses: actions/upload-artifact@v4
        with:
          name: final-merged-results
          path: ./all_results/combined_results.csv
          retention-days: 90