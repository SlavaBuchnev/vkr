name: Run EA Experiments

on:
  workflow_dispatch:

jobs:
  generate-chunks:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.generate.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Generate chunks
        id: generate
        run: |
          python generate_chunks.py
          echo "chunks=$(cat chunks.json | jq -c .)" >> $GITHUB_OUTPUT

  run-chunks:
    needs: generate-chunks
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.generate-chunks.outputs.chunks) }}
    name: Chunk ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
      - name: Call reusable workflow for this chunk
        uses: ./.github/workflows/run-ea-tests-chunk.yml
        with:
          items: ${{ toJson(matrix.chunk) }}

  merge-results:
    needs: run-chunks
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pandas
        run: pip install pandas
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: ./all_results
      - name: Merge CSVs
        run: python merge-csv.py
        working-directory: ./all_results
      - name: Upload final CSV
        uses: actions/upload-artifact@v4
        with:
          name: final-merged-results
          path: ./all_results/combined_results.csv
          retention-days: 90