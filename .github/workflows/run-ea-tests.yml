name: Run EA Experiments

on:
  workflow_dispatch:

jobs:
  generate-chunks:
    runs-on: ubuntu-latest
    outputs:
      batch_indices: ${{ steps.generate.outputs.batch_indices }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate chunks
        id: generate
        run: |
          # Скрипт создаёт chunks.json
          python generate_chunks.py

          if [ ! -f chunks.json ]; then
            echo "Error: chunks.json was not created" >&2
            exit 1
          fi

          CHUNKS_COUNT=$(jq length chunks.json)
          if [ "$CHUNKS_COUNT" -eq 0 ]; then
            echo "Error: chunks.json is empty" >&2
            exit 1
          fi
          echo "Total chunks: $CHUNKS_COUNT" >> $GITHUB_STEP_SUMMARY

          BATCH_SIZE=50   # количество чанков на одно задание матрицы
          NUM_BATCHES=$(( (CHUNKS_COUNT + BATCH_SIZE - 1) / BATCH_SIZE ))
          echo "Number of batches: $NUM_BATCHES" >> $GITHUB_STEP_SUMMARY

          # Массив индексов батчей в формате JSON
          BATCH_INDICES=$(seq 0 $((NUM_BATCHES - 1)) | jq -R -s -c 'split("\n")[:-1] | map(tonumber)')
          echo "batch_indices=$BATCH_INDICES" >> $GITHUB_OUTPUT

      - name: Upload chunks.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunks-data-${{ github.run_id }}
          path: chunks.json

  run-chunks:
    needs: generate-chunks
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.generate-chunks.outputs.batch_indices) }}
    name: Batch ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download chunks data
        uses: actions/download-artifact@v4
        with:
          name: chunks-data-${{ github.run_id }}
          path: ./chunks_data
      - name: Run batch of chunks
        env:
          BATCH_INDEX: ${{ matrix.batch }}
          BATCH_SIZE: 50
        run: |
          CHUNKS_FILE="./chunks_data/chunks.json"
          START=$(( BATCH_INDEX * BATCH_SIZE ))
          END=$(( START + BATCH_SIZE ))

          # Извлекаем порцию чанков для этого батча
          CHUNK_JSON=$(jq -c ".[$START:$END]" "$CHUNKS_FILE")

          echo "$CHUNK_JSON" | jq -c '.[]' | while read item; do
            pop_size=$(echo "$item" | jq -r '.pop_size')
            gens=$(echo "$item" | jq -r '.gens')
            cross_rate=$(echo "$item" | jq -r '.cross_rate')
            mut_rate=$(echo "$item" | jq -r '.mut_rate')
            tourn_size=$(echo "$item" | jq -r '.tourn_size')
            elitism=$(echo "$item" | jq -r '.elitism')
            use_local_search=$(echo "$item" | jq -r '.use_local_search')
            ls_freq=$(echo "$item" | jq -r '.ls_freq')
            strategy=$(echo "$item" | jq -r '.strategy')
            init_method=$(echo "$item" | jq -r '.init_method')

            mkdir -p configs
            cat > configs/ea_params.json <<EOF
            {
              "pop_size": $pop_size,
              "gens": $gens,
              "cross_rate": $cross_rate,
              "mut_rate": $mut_rate,
              "tourn_size": $tourn_size,
              "elitism": $elitism,
              "use_local_search": $use_local_search,
              "ls_freq": $ls_freq,
              "strategy": "$strategy",
              "init_method": "$init_method"
            }
            EOF

            pytest test/integration/test_ea_tests.py -v || true

            # Уникальное имя файла со всеми параметрами
            FILENAME="results"
            FILENAME+="_pop${pop_size}"
            FILENAME+="_gen${gens}"
            FILENAME+="_cr${cross_rate}"
            FILENAME+="_mr${mut_rate}"
            FILENAME+="_ts${tourn_size}"
            FILENAME+="_el${elitism}"
            FILENAME+="_ls${use_local_search}"
            FILENAME+="_lsf${ls_freq}"
            FILENAME+="_${strategy}"
            FILENAME+="_${init_method}"
            FILENAME+=".csv"

            if [ -f configs/ea_results.csv ]; then
              mv configs/ea_results.csv "$FILENAME"
            else
              echo "Warning: configs/ea_results.csv not found for $pop_size $gens"
            fi
          done
      - name: Upload CSVs from this batch
        uses: actions/upload-artifact@v4
        with:
          name: results-batch-${{ matrix.batch }}-${{ github.run_id }}
          path: "results_*.csv"

  merge-results:
    needs: run-chunks
    if: ${{ !cancelled() && needs.run-chunks.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas
        run: pip install pandas
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-batch-*
          merge-multiple: true
          path: ./all_results
      - name: Merge CSVs using merge-csv.py
        run: |
          cp ../merge-csv.py .
          python merge-csv.py
        working-directory: ./all_results
      - name: Upload final CSV
        uses: actions/upload-artifact@v4
        with:
          name: final-merged-results
          path: ./all_results/combined_results.csv
          retention-days: 90