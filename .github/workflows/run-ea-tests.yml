name: Run EA Experiments (3 reusable matrices)

on:
  workflow_dispatch:

jobs:
  pop250:
    uses: ./.github/workflows/run-ea-chunk.yml
    with:
      pop_size: 250
      chunk_artifact_name: chunks-250
      max_jobs: 256

  pop500:
    uses: ./.github/workflows/run-ea-chunk.yml
    with:
      pop_size: 500
      chunk_artifact_name: chunks-500
      max_jobs: 256

  pop1000:
    uses: ./.github/workflows/run-ea-chunk.yml
    with:
      pop_size: 1000
      chunk_artifact_name: chunks-1000
      max_jobs: 256

  merge-results:
    needs: [pop250, pop500, pop1000]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: results-pop*
          merge-multiple: true
          path: ./all_results
      - name: Merge CSVs
        working-directory: ./all_results
        run: |
          cp ../merge-csv.py .
          python merge-csv.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-merged-results
          path: ./all_results/combined_results.csv
          retention-days: 90
