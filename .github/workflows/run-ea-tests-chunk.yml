name: Run EA Tests Chunk

on:
  workflow_call:
    inputs:
      items:
        required: true
        type: string

jobs:
  run-chunk-sequential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest
      - name: Run all items in this chunk sequentially
        env:
          ITEMS_JSON: ${{ inputs.items }}
        run: |
          echo "$ITEMS_JSON" | jq -c '.[]' | while read item; do
            pop_size=$(echo "$item" | jq -r '.pop_size')
            gens=$(echo "$item" | jq -r '.gens')
            cross_rate=$(echo "$item" | jq -r '.cross_rate')
            mut_rate=$(echo "$item" | jq -r '.mut_rate')
            tourn_size=$(echo "$item" | jq -r '.tourn_size')
            elitism=$(echo "$item" | jq -r '.elitism')
            use_local_search=$(echo "$item" | jq -r '.use_local_search')
            ls_freq=$(echo "$item" | jq -r '.ls_freq')
            strategy=$(echo "$item" | jq -r '.strategy')
            init_method=$(echo "$item" | jq -r '.init_method')
            
            mkdir -p configs
            cat > configs/ea_params.json <<EOF
            {
              "pop_size": $pop_size,
              "gens": $gens,
              "cross_rate": $cross_rate,
              "mut_rate": $mut_rate,
              "tourn_size": $tourn_size,
              "elitism": $elitism,
              "use_local_search": $use_local_search,
              "ls_freq": $ls_freq,
              "strategy": "$strategy",
              "init_method": "$init_method"
            }
            EOF
            
            pytest test/integration/test_ea_tests.py -v
            
            mv configs/ea_results.csv "results_pop${pop_size}_gen${gens}_cr${cross_rate}_mr${mut_rate}.csv"
          done
      - name: Upload all CSVs from this chunk
        uses: actions/upload-artifact@v4
        with:
          name: results-chunk-${{ github.run_id }}-${{ strategy.job-index }}
          path: "results_*.csv"